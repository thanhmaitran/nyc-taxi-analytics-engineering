name: analytics_engineering_warehouse
version: "1.0.0"
config-version: 2

profile: analytics_engineering_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  reprocess_files: []          # file names (basename) to force-reload in incremental runs
  dedupe_exact_duplicates: true

seeds:
  analytics_engineering_warehouse:
    taxi_zone_lookup:
      +column_types:
        LocationID: integer
        Borough: varchar
        Zone: varchar
        service_zone: varchar

models:
  analytics_engineering_warehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      core:
        +materialized: table
      analytics:
        +materialized: table
